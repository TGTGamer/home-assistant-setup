version = 1
name = "home-assistant-setup"

[setup]
script = "scripts/agent-setup.sh"

[[actions]]
name = "Verify"
icon = "test"
command = "pnpm verify"

[[actions]]
name = "Test"
icon = "test"
command = "pnpm test"

[[actions]]
name = "Previews"
icon = "run"
command = "pnpm preview"
