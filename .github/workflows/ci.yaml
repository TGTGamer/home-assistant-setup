name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, house checks, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      # The same checks as local: lint, types, tests, house checks, licences.
      - run: pnpm verify

  app-lint:
    name: Home Assistant app lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./oled_status

  app-build:
    name: Build app image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform ${{ matrix.platform }} -t oled-status:ci oled_status
      # Keep the image's own entrypoint (s6-overlay's /init), as the Supervisor
      # does, so environment and start-up problems show up here.
      - name: Smoke test the image
        run: docker run --rm --platform ${{ matrix.platform }} oled-status:ci python3 -m oled_status --preview /tmp/previews
      # Start the real CMD with a token, as the Supervisor would. There is no
      # OLED in CI, so it must get past the token check and fail on the
      # display instead.
      - name: Check the token reaches the app
        run: |
          log=$(timeout 60 docker run --rm --platform ${{ matrix.platform }} -e SUPERVISOR_TOKEN=ci oled-status:ci 2>&1 || true)
          echo "$log"
          if echo "$log" | grep -q "set SUPERVISOR_TOKEN"; then echo "::error::SUPERVISOR_TOKEN did not reach the app"; exit 1; fi
          echo "$log" | grep -qi "i2c" || { echo "::error::expected the app to reach the display step"; exit 1; }
