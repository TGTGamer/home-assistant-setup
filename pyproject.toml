# Workspace root: development tooling only. The app itself is `oled_status/`.
[project]
name = "home-assistant-setup"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["oled-status"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-licenses>=5.0",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.uv.sources]
oled-status = { workspace = true }

[tool.uv.workspace]
members = ["oled_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["externals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["oled_status", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["oled_status/src", "tests", "scripts"]
exclude = ["externals/"]

[[tool.mypy.overrides]]
module = ["luma.*"]
ignore_missing_imports = true
