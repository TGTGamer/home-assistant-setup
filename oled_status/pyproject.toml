[project]
name = "oled-status"
version = "0.1.1"
description = "Home status pages for a small SSD1306 OLED, as a Home Assistant app"
readme = "README.md"
license = "LicenseRef-FCL-1.0-MIT"
requires-python = ">=3.13"
dependencies = [
    "luma.oled>=3.14",
    "pillow>=11.0",
]

[project.scripts]
oled-status = "oled_status.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oled_status"]
