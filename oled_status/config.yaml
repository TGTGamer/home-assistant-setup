name: OLED Status
version: "0.1.0"
slug: oled_status
description: Rotating home status pages and alerts on a small SSD1306 OLED
url: https://github.com/TGTGamer/home-assistant-setup/tree/main/oled_status
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
devices:
  - /dev/i2c-1
options:
  i2c_port: 1
  i2c_address: "0x3C"
  rotate: 0
  contrast: 255
  night_contrast: 8
  night_start: "23:00"
  night_end: "07:00"
  screen_off_at_night: false
  page_seconds: 8
  refresh_seconds: 5
  pages:
    - clock
    - weather
    - people
    - locks
    - heating
    - bins
    - media
    - ups
    - mood
    - starfield
  weather: ""
  climate: ""
  media_player: ""
  ups_battery: ""
  ups_charging: ""
  persons: []
  locks: []
  bins: []
  leak_sensors: []
  ignored_lights: []
schema:
  i2c_port: int(0,20)
  i2c_address: match(^0x[0-9a-fA-F]{2}$)
  rotate: int(0,3)
  contrast: int(0,255)
  night_contrast: int(0,255)
  night_start: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  night_end: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  screen_off_at_night: bool
  page_seconds: int(2,120)
  refresh_seconds: int(1,300)
  pages:
    - list(clock|weather|people|locks|heating|bins|media|ups|mood|starfield)
  weather: str?
  climate: str?
  media_player: str?
  ups_battery: str?
  ups_charging: str?
  persons:
    - str
  locks:
    - str
  bins:
    - str
  leak_sensors:
    - str
  ignored_lights:
    - str
