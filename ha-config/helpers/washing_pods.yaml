# Helpers for the washing pods tracker (ha-config/automations/washing_pods_tracker.yaml).
# Pasted into configuration.yaml on the hub; reload with the input_boolean
# reload action (the counter needs a restart).

counter:
  washing_machine_pods:
    name: Washing machine pods
    icon: mdi:washing-machine
    initial: 0
    step: 1
    minimum: 0
    maximum: 500

input_boolean:
  washing_pods_asked_jonathan:
    name: Washing pods asked Jonathan
    icon: mdi:cart-outline
    initial: false
  washing_pods_asked_jake:
    name: Washing pods asked Jake
    icon: mdi:cart-outline
    initial: false
