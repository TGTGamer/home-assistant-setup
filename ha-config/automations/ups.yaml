# UPS Plus automations, as created on the hub (Settings, Automations).
# Needs the UPS Plus integration and the "UPS mains power" template binary
# sensor (device_class: plug). Its state is unknown, not off, while the UPS
# readings are unavailable, so a failed read never looks like a power cut:
#   {% set v = [states('sensor.ups_type_c_voltage'),
#               states('sensor.ups_micro_usb_voltage')]
#      | select('is_number') | map('float') | list %}
#   {{ (v | max > 4.5) if v | count == 2 else none }}
- id: ups_power_source_notify
  alias: 'UPS: power source changed'
  description: Tells you when the hub switches between mains and battery.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.ups_mains_power
    from: 'on'
    to: 'off'
    for:
      seconds: 30
    id: battery
  - trigger: state
    entity_id: binary_sensor.ups_mains_power
    from: 'off'
    to: 'on'
    for:
      seconds: 30
    id: mains
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: battery
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: ups_power
          title: Hub on battery
          message: Mains power to the Home Assistant hub is off. Battery at {{ states('sensor.ups_battery_capacity')
            }}%.
    - conditions:
      - condition: trigger
        id: mains
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: ups_power
          title: Hub back on mains
          message: Mains power is back. Battery at {{ states('sensor.ups_battery_capacity') }}%.
- id: ups_low_battery_shutdown
  alias: 'UPS: clean shutdown on low battery'
  description: Shuts the host down cleanly before the UPS cuts power. The UPS switch 'turn on after power
    on' restarts the Pi when mains returns.
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ups_battery_capacity
    below: 25
    for:
      minutes: 1
  - trigger: numeric_state
    entity_id: sensor.ups_battery_voltage
    below: 3.75
    for:
      minutes: 1
  conditions:
  - condition: state
    entity_id: binary_sensor.ups_mains_power
    state: 'off'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: ups_shutdown
      title: Hub shutting down
      message: Battery low ({{ states('sensor.ups_battery_capacity') }}%, {{ states('sensor.ups_battery_voltage')
        }} V) with no mains power. Shutting down cleanly.
  - delay:
      seconds: 30
  - action: hassio.host_shutdown
    data: {}
- id: ups_reload_when_unavailable
  alias: 'UPS: reload when readings are unavailable'
  description: The UPS can miss its first I2C read at boot; reload the integration so readings come back.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.ups_battery_capacity
    to: unavailable
    for:
      minutes: 2
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: sensor.ups_battery_capacity
    state: unavailable
  actions:
  - delay:
      seconds: 30
  - action: homeassistant.reload_config_entry
    target:
      entity_id: sensor.ups_battery_capacity

