# Washing pods: count down a pod per wash cycle and nag for more on the way home.
# Works for both people in the house; either one's answer updates the shared count.
#
# Helpers live in configuration.yaml (ha-config/helpers/washing_pods.yaml):
#   counter.washing_machine_pods               Pods in the cupboard, minimum 0.
#   input_boolean.washing_pods_asked_jonathan  On between that person's
#   input_boolean.washing_pods_asked_jake      leaving-work reminder and their
#                                              answer at home.
#
# Entities used:
#   sensor.kitchen_washing_machine_job_state   SmartThings washer-dryer job
#                                              state: weight_sensing, wash,
#                                              rinse, spin, drying, finish, none.
#   person.jonathan_stevens, zone.jonathan_s_office
#   person.jake_east, zone.jake_s_work
#   notify.mobile_app_jonathan_s_phone         The companion app's notify actions.
#   notify.mobile_app_sm_s928b                 notify.send_message cannot carry
#                                              the data block the buttons need.
#
# How it behaves:
#   1. The washer reporting a "wash" job takes one pod off the counter. A
#      drying-only run never reports "wash", so it does not count. At most once
#      per 30 minutes, in case a paused cycle reports the phase again. The
#      counter stops at 0.
#   2. Whoever leaves their work zone with fewer than 5 pods gets a reminder,
#      every time.
#   3. Arriving home after a reminder, that person is asked whether they bought
#      any. "Bought some" opens a text field for the number (the REPLY action on
#      Android, text input on iOS); "Didn't get any" leaves the count alone, so
#      the next time they leave work it reminds them again.
#   4. The answer is matched to the phone that sent it. Buying pods clears both
#      people's pending questions and tells the other person, so nobody buys
#      twice.
#   5. A wash that drops the count below 5 sends both phones a heads-up.
#
# Every phone notification uses the tag "washing_pods", so each one replaces
# the last rather than piling up. "Run actions" in the UI treats the run as
# Jonathan's, since no trigger says whose it is.

- id: washing_pods_count_down
  alias: 'Washing pods: count down on wash'
  description: Takes one pod off the counter when the washer starts a wash job.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.kitchen_washing_machine_job_state
    to: wash
  conditions:
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered > timedelta(minutes=30) }}
  actions:
  - action: counter.decrement
    target:
      entity_id: counter.washing_machine_pods
  - if:
    - condition: numeric_state
      entity_id: counter.washing_machine_pods
      below: 5
    then:
    - repeat:
        for_each:
        - notify.mobile_app_jonathan_s_phone
        - notify.mobile_app_sm_s928b
        sequence:
        - action: "{{ repeat.item }}"
          data:
            title: Washing pods running low
            message: "{{ states('counter.washing_machine_pods') }} left after this wash."
            data:
              tag: washing_pods

- id: washing_pods_leaving_work
  alias: 'Washing pods: remind when leaving work'
  description: Reminds whoever leaves work to buy pods while fewer than 5 are left.
  mode: parallel
  variables:
    phones:
      jonathan: notify.mobile_app_jonathan_s_phone
      jake: notify.mobile_app_sm_s928b
  triggers:
  - trigger: zone
    entity_id: person.jonathan_stevens
    zone: zone.jonathan_s_office
    event: leave
    id: jonathan
  - trigger: zone
    entity_id: person.jake_east
    zone: zone.jake_s_work
    event: leave
    id: jake
  conditions:
  - condition: numeric_state
    entity_id: counter.washing_machine_pods
    below: 5
  actions:
  - variables:
      who: "{{ trigger.id | default('jonathan') }}"
  - action: input_boolean.turn_on
    target:
      entity_id: "input_boolean.washing_pods_asked_{{ who }}"
  - action: "{{ phones[who] }}"
    data:
      title: Buy washing pods
      message: "Only {{ states('counter.washing_machine_pods') }} left. Pick some up on the way home?"
      data:
        tag: washing_pods

- id: washing_pods_arriving_home
  alias: 'Washing pods: ask when home'
  description: After a reminder, asks the person arriving home whether they bought pods.
  mode: parallel
  variables:
    phones:
      jonathan: notify.mobile_app_jonathan_s_phone
      jake: notify.mobile_app_sm_s928b
  triggers:
  - trigger: zone
    entity_id: person.jonathan_stevens
    zone: zone.home
    event: enter
    id: jonathan
  - trigger: zone
    entity_id: person.jake_east
    zone: zone.home
    event: enter
    id: jake
  conditions:
  - condition: template
    value_template: "{{ is_state('input_boolean.washing_pods_asked_' ~ (trigger.id | default('jonathan')), 'on') }}"
  actions:
  - variables:
      who: "{{ trigger.id | default('jonathan') }}"
  - action: "{{ phones[who] }}"
    data:
      title: Did you get washing pods?
      message: "{{ states('counter.washing_machine_pods') }} in the cupboard right now."
      data:
        tag: washing_pods
        actions:
        - action: REPLY
          title: Bought some
          behavior: textInput
          textInputButtonTitle: Add
          textInputPlaceholder: How many pods?
        - action: WASHING_PODS_NOT_BOUGHT
          title: Didn't get any

- id: washing_pods_answer
  alias: 'Washing pods: handle the answer'
  description: Adds the pods someone bought and tells the other person, or leaves the count so their next leave-work reminder fires.
  mode: queued
  variables:
    phones:
      jonathan: notify.mobile_app_jonathan_s_phone
      jake: notify.mobile_app_sm_s928b
    owners:
      281d66d8057b545faa47672475eff8a8: jonathan
      1594861c31265003b8f73dd2d844c177: jake
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: REPLY
    id: bought
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: WASHING_PODS_NOT_BOUGHT
    id: not_bought
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.tag | default('washing_pods') == 'washing_pods' }}"
  actions:
  - variables:
      who: "{{ owners.get(trigger.event.data.device_id, 'jonathan') if trigger.event is defined else 'jonathan' }}"
      other: "{{ 'jake' if who == 'jonathan' else 'jonathan' }}"
  - action: input_boolean.turn_off
    target:
      entity_id: "input_boolean.washing_pods_asked_{{ who }}"
  - if:
    - condition: trigger
      id: bought
    then:
    - variables:
        bought: "{{ trigger.event.data.reply_text | default('') | regex_findall('\\d+') | first | default(0) | int(0) }}"
    - action: counter.set_value
      target:
        entity_id: counter.washing_machine_pods
      data:
        value: "{{ states('counter.washing_machine_pods') | int(0) + bought }}"
    - action: input_boolean.turn_off
      target:
        entity_id: "input_boolean.washing_pods_asked_{{ other }}"
    - action: "{{ phones[who] }}"
      data:
        title: Washing pods updated
        message: "Added {{ bought }}. {{ states('counter.washing_machine_pods') }} in stock."
        data:
          tag: washing_pods
    - action: "{{ phones[other] }}"
      data:
        title: Washing pods sorted
        message: "{{ who | capitalize }} bought {{ bought }}. {{ states('counter.washing_machine_pods') }} in stock, no need to get more."
        data:
          tag: washing_pods
