# Washing pods: count down a pod per wash cycle and nag for more on the way home.
#
# Helpers (Settings, Devices and services, Helpers), both created once:
#   counter.washing_machine_pods        Counter, name "Washing machine pods",
#                                       minimum 0, step 1, initial value 0.
#   input_boolean.washing_pods_asked    Toggle, name "Washing pods asked".
#                                       On between the leaving-work reminder and
#                                       your answer at home.
#
# Replace these entity IDs with yours before pasting (Settings, Automations,
# three-dot menu, Edit in YAML, one automation at a time):
#   sensor.washing_machine_power        Power reading of the washing machine's
#                                       smart plug, in W.
#   person.me                           Your person entity.
#   zone.work                           Your work zone (Settings, Areas and zones).
#   notify.mobile_app_my_phone          Your phone's notify action, listed under
#                                       Developer tools, Actions, as
#                                       "notify.mobile_app_<phone name>".
#
# How it behaves:
#   1. The plug drawing over 5 W for a minute counts as a wash and takes one pod
#      off the counter, at most once per 90 minutes so a cycle's pauses do not
#      count twice. The counter stops at 0.
#   2. Leaving work with fewer than 5 pods sends a reminder, every time.
#   3. Arriving home after a reminder asks whether you bought any. "Bought some"
#      takes the number you type and adds it; "Didn't get any" leaves the count
#      alone, so the next time you leave work it reminds you again.
#   4. If a wash drops the count below 5 you get a heads-up at the time, too.
#
# Everything a notification does uses the companion app's own notify action,
# not notify.send_message, which only works with notify entities and cannot
# carry the action buttons.

- id: washing_pods_count_down
  alias: 'Washing pods: count down on wash'
  description: Takes one pod off the counter when the washing machine starts a cycle.
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.washing_machine_power
    above: 5
    for:
      minutes: 1
  conditions:
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered > timedelta(minutes=90) }}
  actions:
  - action: counter.decrement
    target:
      entity_id: counter.washing_machine_pods
  - if:
    - condition: numeric_state
      entity_id: counter.washing_machine_pods
      below: 5
    then:
    - action: notify.mobile_app_my_phone
      data:
        title: Washing pods running low
        message: "{{ states('counter.washing_machine_pods') }} left after this wash."
        data:
          tag: washing_pods

- id: washing_pods_leaving_work
  alias: 'Washing pods: remind when leaving work'
  description: Reminds you to buy pods on the way home while fewer than 5 are left.
  mode: single
  triggers:
  - trigger: zone
    entity_id: person.me
    zone: zone.work
    event: leave
  conditions:
  - condition: numeric_state
    entity_id: counter.washing_machine_pods
    below: 5
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.washing_pods_asked
  - action: notify.mobile_app_my_phone
    data:
      title: Buy washing pods
      message: "Only {{ states('counter.washing_machine_pods') }} left. Pick some up on the way home?"
      data:
        tag: washing_pods

- id: washing_pods_arriving_home
  alias: 'Washing pods: ask when home'
  description: After a reminder, asks whether you bought pods and how many.
  mode: single
  triggers:
  - trigger: zone
    entity_id: person.me
    zone: zone.home
    event: enter
  conditions:
  - condition: state
    entity_id: input_boolean.washing_pods_asked
    state: 'on'
  actions:
  - action: notify.mobile_app_my_phone
    data:
      title: Did you get washing pods?
      message: "{{ states('counter.washing_machine_pods') }} in the cupboard right now."
      data:
        tag: washing_pods
        actions:
        - action: WASHING_PODS_BOUGHT
          title: Bought some
          behavior: textInput
          textInputButtonTitle: Add
          textInputPlaceholder: How many pods?
        - action: WASHING_PODS_NOT_BOUGHT
          title: Didn't get any

- id: washing_pods_answer
  alias: 'Washing pods: handle the answer'
  description: Adds the pods you bought, or leaves the count so the next leave-work reminder fires.
  mode: queued
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: WASHING_PODS_BOUGHT
    id: bought
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: WASHING_PODS_NOT_BOUGHT
    id: not_bought
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.washing_pods_asked
  - if:
    - condition: trigger
      id: bought
    then:
    - variables:
        bought: "{{ trigger.event.data.reply_text | default('') | regex_findall('\\d+') | first | default(0) | int(0) }}"
    - action: counter.set_value
      target:
        entity_id: counter.washing_machine_pods
      data:
        value: "{{ states('counter.washing_machine_pods') | int(0) + bought }}"
    - action: notify.mobile_app_my_phone
      data:
        title: Washing pods updated
        message: "Added {{ bought }}. {{ states('counter.washing_machine_pods') }} in stock."
        data:
          tag: washing_pods
